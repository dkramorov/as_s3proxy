server {
    listen 443 ssl;
    listen 80;
    listen 9000 ssl;
    server_name minio-archive-5.example.com;
    # Получить сертификат через letsencrypt
    #ssl_certificate /etc/ssl/certs/сертификат.crt;
    #ssl_certificate_key /etc/ssl/private/ключ.key;

    # Отключаем ограничение размера загружаемых файлов (для крупных S3-объектов)
    client_max_body_size 0;
    # Отключаем буферизацию запросов/ответов для стриминга в S3
    proxy_request_buffering off;
    proxy_buffering off;
    # Отключаем модификации
    ignore_invalid_headers off;
    merge_slashes off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        # Важно: БЕЗ слеша в конце после порта!
        # Тогда Nginx передает оригинальный URI и все query-параметры (?...) без перекодирования
        proxy_pass http://127.0.0.1:7070;

        # Передаем сырой $request_uri без перекодирования Nginx
        #rewrite ^/(.*) /$1 break;
        #proxy_pass http://127.0.0.1:7070$request_uri;
    }
}